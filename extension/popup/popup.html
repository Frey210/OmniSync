<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>OmniSync Dashboard</title>
  <link rel="stylesheet" href="popup.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="header">
    <div class="logo-box">
       <img class="logo-icon" src="../icons/icon32.png" alt="OmniSync Logo" />
       <h2>OmniSync</h2>
    </div>
    <div id="user-info" class="hidden">
       <button id="anilist-btn" class="anilist-btn" title="Link AniList">🔗 AniList</button>
       <span id="user-email"></span>
       <button id="logout-btn" class="sm-btn">Logout</button>
    </div>
  </div>

  <div id="auth-view">
    <div class="auth-card">
       <h3 id="auth-title">Welcome Back</h3>
       <p id="auth-subtitle">Sign in to sync your library across devices.</p>
       <button id="anilist-login-btn" class="anilist-login-btn">
         <svg width="16" height="16" viewBox="0 0 24 24" fill="none" style="margin-right:6px;flex-shrink:0"><path d="M6.361 3L2 21h3.86l.807-3h5.86l.807 3H17l.5-1.865L19.5 21H22l-4.5-18H13l-2.5 10L8 3H6.361zM7.5 15l1.5-6 1.5 6H7.5z" fill="currentColor"/></svg>
         Continue with AniList
       </button>
       <div class="auth-divider"><span>or</span></div>
       <div class="input-group">
         <input type="email" id="email" placeholder="Email Address" />
       </div>
       <div class="input-group">
         <input type="password" id="password" placeholder="Password" />
       </div>
       <button id="auth-submit-btn" class="primary-btn">Sign In</button>
       <p id="auth-error" class="error-msg hidden"></p>
       <p class="auth-switch">
         <span id="auth-switch-text">Don't have an account?</span> 
         <a href="#" id="auth-toggle-link">Sign Up</a>
       </p>
    </div>
  </div>

  <div id="dashboard-view" class="hidden">
    <div class="controls-container">
      <div class="search-bar">
         <input type="text" id="search-input" placeholder="Search your library..." autocomplete="off"/>
         <svg class="search-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      </div>
      <div class="filter-tabs">
        <button class="filter-btn active" data-filter="ALL">All</button>
        <button class="filter-btn" data-filter="ANIME">Anime</button>
        <button class="filter-btn" data-filter="MANGA">Manga</button>
      </div>
    </div>

    <div id="stats-bar">
      <div class="stat-item">
        <span class="stat-number" id="stat-anime">0</span>
        <span class="stat-label">Anime</span>
      </div>
      <div class="stat-divider"></div>
      <div class="stat-item">
        <span class="stat-number" id="stat-manga">0</span>
        <span class="stat-label">Manga</span>
      </div>
      <div class="stat-divider"></div>
      <div class="stat-item">
        <span class="stat-number" id="stat-eps">0</span>
        <span class="stat-label">Episodes</span>
      </div>
    </div>
    
    <div id="loading" class="hidden">
       <div class="spinner"></div>
    </div>

    <ul id="progress-list">
       <!-- Items will go here -->
    </ul>
    
    <div id="empty-state" class="hidden empty-state-box">
       <div class="empty-icon">📂</div>
       <p>No titles found.</p>
    </div>
  </div>

  <script src="../utils/auth.js"></script>
  <script src="../utils/api.js"></script>
  <script src="popup.js"></script>
</body>
</html>
